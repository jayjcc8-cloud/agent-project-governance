name: Bug report
description: Report reproducible behavior that does not match APG's documented contract.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a reproducible APG problem.
  - type: input
    id: version
    attributes:
      label: APG version
      description: Release tag, plugin version, or commit SHA.
      placeholder: v0.4.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.13.5
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: Codex CLI, Codex app, or another environment.
      placeholder: Codex CLI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence and a minimal repository when possible.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, secrets, and private repository data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not an exploitable vulnerability; security reports use SECURITY.md.
          required: true
