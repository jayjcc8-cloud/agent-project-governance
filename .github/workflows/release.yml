name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Verify tag and package
        run: python scripts/validate_package.py --tag "${GITHUB_REF_NAME}"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build deterministic archive
        run: |
          mkdir -p dist
          python scripts/package_release.py --output "dist/agent-project-governance-${GITHUB_REF_NAME}.zip"
          sha256sum "dist/agent-project-governance-${GITHUB_REF_NAME}.zip" > "dist/agent-project-governance-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/agent-project-governance-${GITHUB_REF_NAME}.zip"
          "dist/agent-project-governance-${GITHUB_REF_NAME}.zip.sha256"
          --verify-tag
          --generate-notes
          --prerelease
